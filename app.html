<div class="page">  <div class="glow" aria-hidden="true"></div>
  <div class="shell" id="shell" data-view="agenda">
    <aside class="side">
      <div class="side-logo"><h1 class="logo">calendar<span class="dot-accent">.</span></h1></div>
      <div id="mini"></div>
      <section id="side-cals"></section>
      <section id="tray-inline"></section>
      <div id="agenda" class="scroller" aria-label="Agenda"></div>
    </aside>
    <main class="main">
      <header id="top">
        <h1 class="logo">calendar<span class="dot-accent">.</span></h1>
        <button class="title-btn" id="title" aria-label="Show the month"><span id="title-text"></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="acts">
          <button class="step" id="prev" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="pill-btn" id="today-btn" aria-label="Today" title="Today (.)"><span class="t-word">Today</span><span class="t-num" id="today-num"></span></button>
          <button class="step" id="next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          <button class="icon-btn" id="side-btn" aria-label="Show the sidebar" aria-pressed="true" title="Show or hide the sidebar (S)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
          </button>
          <button class="icon-btn" id="tasks-btn" aria-label="Show tasks" aria-pressed="true" title="Show or hide tasks (T)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </button>
          <button class="icon-btn" id="inbox-btn" aria-label="Unscheduled tasks">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            <span class="badge" id="inbox-badge" hidden></span>
          </button>
          <a class="icon-btn" id="tasks-link" href="../taskhub/" data-hub="tasks" aria-label="Open tasks." title="Open tasks.">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 8 8 4"/><polyline points="3 16 5 18 8 14"/><line x1="12" y1="6" x2="21" y2="6"/><line x1="12" y1="16" x2="21" y2="16"/></svg>
          </a>
          <button class="icon-btn" id="settings-btn" aria-label="Settings">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="icon-btn refresh" id="refresh-btn" aria-label="Refresh" title="Fetch calendars and tasks again (R)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </header>
      <nav id="views" aria-label="View">
        <button data-view="agenda">List</button>
        <button data-view="day">Day</button>
        <button data-view="week">Week</button>
        <button data-view="month">Month</button>
      </nav>
      <div id="strip"></div>
      <div id="banner" hidden><span id="banner-text"></span><button id="banner-btn"></button></div>
      <div id="quick">
        <div class="qa-preview" id="qa-preview" hidden>
          <span class="desc" id="qa-desc"></span>
          <div class="qa-chips" id="qa-chips"></div>
        </div>
        <form class="qa-row" id="qa-form" autocomplete="off">
          <input class="qa-input" id="qa-input" enterkeyhint="done" autocapitalize="sentences"
            placeholder="Add an event" aria-label="Add an event">
          <button class="qa-add" id="qa-add" disabled>Add</button>
        </form>
      </div>
      <div id="grid"></div>
    </main>
  </div>

  <div class="sheet-layer" id="sheet-layer" hidden>
    <div class="sheet-back" id="sheet-back"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="loading-line" id="busy" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>

  <!-- The version is bumped on each release so a phone holding the page in
       its cache still fetches the new code. -->
</div>
