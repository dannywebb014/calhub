name: Android widget

# Builds the home-screen widget app in android/. On main, the APK is put on
# the "widget" release, so the download link never changes:
# https://github.com/dannywebb014/calhub/releases/download/widget/calhub-widget.apk
on:
  push:
    paths: ["android/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: calhub-widget
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish to the widget release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk calhub-widget.apk
          gh release view widget >/dev/null 2>&1 || gh release create widget --title "calendar. widget" --latest=false \
            --notes "The Android home-screen widget for calendar. Open this page on your phone and tap calhub-widget.apk to install or update it."
          gh release upload widget calhub-widget.apk --clobber
